server:
  port: 8081

spring:
  application:
    name: user-service
  cloud:
    discovery:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/usersdb}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  sql:
    init:
      mode: always
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

security:
  jwt:
    access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}

user:
  topic: user-events

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [user-service] [correlationId=%X{correlationId:-N/A}] [%thread] %logger{36} - %msg%n"
  level:
    org:
      springframework:
        web: INFO
        security: INFO
    com.netflix.eureka: WARN
    com.netflix.discovery: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: User Service
    version: 1.0.0
    description: Service that handles user registration, login, JWT issuance, and profile management
  technology:
    java: 17
    framework: Spring Boot
    architecture: Microservices
  domain:
    bounded-context: Identity and Access Management
    main-responsibilities: Registration, login, JWT authentication, refresh tokens, and user profiles
  messaging:
    kafka-topic: user-events