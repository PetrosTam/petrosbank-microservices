server:
  port: 8082

spring:
  application:
    name: account-service
  cloud:
    discovery:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/accountdb}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

account:
  topic: account-events

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [account-service] [correlationId=%X{correlationId:-N/A}] [%thread] %logger{36} - %msg%n"
  level:
    org:
      springframework:
        web: INFO
        security: INFO
    com.netflix.eureka: WARN
    com.netflix.discovery: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info,env
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: Account Service
    version: 1.0.0
    description: Service that manages account creation, balance tracking, and admin-level operations
  technology:
    java: 17
    framework: Spring Boot
    architecture: Microservices
  domain:
    bounded-context: Account Management
    main-responsibilities: Account creation, account limits, account status, balance records, and account ownership validation
  messaging:
    kafka-topic: account-events