server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/v1/users/**

            - id: account-service
              uri: lb://ACCOUNT-SERVICE
              predicates:
                - Path=/api/v1/accounts/**

            - id: transaction-service
              uri: lb://TRANSACTION-SERVICE
              predicates:
                - Path=/api/v1/transactions/**

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [api-gateway] [correlationId=%X{correlationId:-N/A}] [%thread] %logger{36} - %msg%n"
  level:
    org:
      springframework:
        cloud:
          gateway: INFO
    reactor:
      netty:
        http:
          client: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: API Gateway
    version: 1.0.0
    description: Central entry point for routing requests to banking microservices
  technology:
    java: 17
    framework: Spring Boot
    architecture: Microservices
  routes:
    user-service: /api/v1/users/**
    account-service: /api/v1/accounts/**
    transaction-service: /api/v1/transactions/**